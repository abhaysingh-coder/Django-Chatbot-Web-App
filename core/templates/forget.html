<!DOCTYPE html>
<html>
<head>
    <title>Chatbot | Forget Password</title>

    <!-- Favicon -->
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'icon.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container-fluid mx-auto">
        <div class="row">
            <div class="col-sm-5 card mx-auto my-5 p-5" style="background-color: rgba(0, 213, 255, 0.2);">
                <div class="text-center">
                    {% load static %}
                    <img src="{% static 'bot avatar.png' %}" class="img-fluid h-50 w-25" alt="">
                    <h3 class="fw-bold">Reset Password</h3>
                    <p class="text-muted mb-0">Reset your password instantly</p>
                </div>
                <form method="post" action="">
                    {% csrf_token %}
                    <!-- Login As -->
                    <div class="mb-3">
                        <label class="form-label">Register As</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-users"></i>
                            </span>
                            <select name="role" class="form-select rounded-end-pill" required>
                                <option value="" selected disabled>Select role</option>
                                <option value="user">User</option>
                                <option value="customer">Customer</option>
                            </select>
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="mb-3 mt-4">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" name="username" class="form-control rounded-end-pill" placeholder="Enter username" required>
                        </div>
                        {% if error_message %}
                        <p class="text-danger small fw-bold">{{ error_message }}</p>
                        {% endif %}
                    </div>
                    <!-- New Password -->
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="password" name="password" class="form-control rounded-0" placeholder="Enter new password"  required>

                            <span class="input-group-text rounded-end-pill" onclick="togglePassword()" style="cursor:pointer;">
                                <i id="eye1" class="fa-solid fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input type="password" id="cpassword" class="form-control rounded-0" placeholder="Confirm password" required>

                            <span class="input-group-text rounded-end-pill" onclick="toggleCPassword()" style="cursor:pointer;">
                                <i id="eye2" class="fa-solid fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Reset Button -->
                    <div class="d-grid col-sm-7 mx-auto mb-3">
                        <button type="submit" class="btn btn-info fw-bold rounded-pill">
                            Reset Password
                        </button>
                    </div>

                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- JS-->
    <script>
        function togglePassword() {
            const pass = document.getElementsByClassName("password");
            const icon = document.getElementsByClassName("eyeIcon");
            if (pass.type === "password") {
                pass.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                pass.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
        const pass = document.getElementsByClassName("password")[0];
        const cpass = document.getElementsByClassName("cpassword")[0];

        function validatePasswords() {
            if (pass.value !== cpass.value) {
                cpass.setCustomValidity("Passwords do not match");
            } else {
                cpass.setCustomValidity("");
            }
        }

        pass.addEventListener("input", validatePasswords);
        cpass.addEventListener("input", validatePasswords);
    </script>
</body>
</html>

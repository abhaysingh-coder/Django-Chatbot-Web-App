<!DOCTYPE html>
<html>
<head>
    <title>Chatbot | Create New Account</title>

    <!-- Favicon -->
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'icon.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container-fluid mx-auto">
        <div class="row">
            <div class="col-sm-5 card mx-auto my-2 py-3" style="background-color: rgba(0, 213, 255, 0.2);">
                <div class="text-center">
                    {% load static %}
                    <img src="{% static 'bot avatar.png' %}" alt="" class="img-fluid h-50 w-25">
                    <h3 class="fw-bold">Chatbot Signup</h3>
                    <p class="text-muted mb-0">Create your account</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <!-- Login As -->
                    <div class="mb-3">
                        <label class="form-label">Register As</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-users"></i>
                            </span>
                            <select name="role" class="form-select rounded-end-pill" required>
                                <option value="" selected disabled>Select role</option>
                                <option value="user">User</option>
                                <option value="customer">Customer</option>
                            </select>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" name="username"
                                class="form-control rounded-end-pill"
                                placeholder="Enter email" required>
                        </div>
                        {% if error_message %}
                        <p class="text-danger small fw-bold">{{ error_message }}</p>
                        {% endif %}
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input type="password" id="password"
                                name="password"
                                class="form-control rounded-0"
                                placeholder="Enter password" required>

                            <span class="input-group-text rounded-end-pill"
                                style="cursor:pointer;" onclick="togglePassword()">
                                <i id="eyeIcon" class="fa-solid fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-pill">
                                <i class="fa-solid fa-lock"></i>
                            </span>

                            <input type="password" id="cpassword"
                                name="confirm_password"
                                class="form-control rounded-0"
                                placeholder="Confirm password" required>

                            <span class="input-group-text rounded-end-pill"
                                style="cursor:pointer;" onclick="toggleConfirmPassword()">
                                <i id="eyeIcon2" class="fa-solid fa-eye"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Signup Button -->
                    <div class="d-grid col-sm-7 mx-auto mb-3">
                        <button type="submit" class="btn btn-info fw-bold rounded-pill">
                            <i class="fa-solid fa-user-plus me-2"></i> Signup
                        </button>
                    </div>

                    <!-- Extra Links -->
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-decoration-none">
                            Already have an account? Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- JS-->
    <script>
        function togglePassword() {
            const pass = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");
            if (pass.type === "password") {
                pass.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                pass.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
        const pass = document.getElementById("password");
        const cpass = document.getElementById("cpassword");

        function validatePasswords() {
            if (pass.value !== cpass.value) {
                cpass.setCustomValidity("Passwords do not match");
            } else {
                cpass.setCustomValidity("");
            }
        }

        pass.addEventListener("input", validatePasswords);
        cpass.addEventListener("input", validatePasswords);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Chatbot | User Support</title>

    <!-- Favicon -->
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'icon.png' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    <div class="container-fluid mx-auto">
        <div class="row">
            <div class="col-sm-9 card mx-auto my-5 p-5" style="background-color: rgba(0, 213, 255, 0.2);">
                <div class="text-center">
                    {% load static %}
                    <img src="{% static 'bot avatar.png' %}" class="img-fluid h-75 w-25" alt="">
                    <h3 class="fw-bold">Task Management</h3>
                    <p class="text-muted mb-0">Manage your tasks efficiently</p>
                </div>
                <div class="row ">
                    <div class="col-sm-12 mx-auto my-5" style="height: 200px; scrollbar-width: none; overflow-y: auto;">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col" class="text-center">S.No</th>
                                    <th scope="col" class="text-center">User Identity</th>
                                    <th scope="col" class="text-center">Utterance</th>
                                    <th scope="col" class="text-center">Flags</th>
                                    <th scope="col" class="text-center">Category</th>
                                    <th scope="col" class="text-center">Intent</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for d in data%}
                                    <tr>
                                        <th class="text-center">{{forloop.counter}}</th>
                                        <th class="text-center">{{d.User_Identity}}</th>
                                        <th class="text-center">{{d.Utterance}}</th>
                                        <td class="text-center">{{d.Flags}}</td>
                                        <td class="text-center">{{d.Category}}</td>
                                        <td class="text-center">{{d.Intent}}</td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

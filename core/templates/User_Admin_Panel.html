<!DOCTYPE html>
<html>
<head>
    <title>User Admin Panel</title>
    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h3 class="text-center fw-bold mb-4">User Admin Panel</h3>

    <table class="table table-bordered table-hover text-center align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Role</th>
                <th>Email</th>
                <th>Password</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.role }}</td>
                <td>{{ user.email }}</td>

                <!-- Password is hashed, real password cannot be shown -->
                <td>{{ user.password }}</td>

                <td>
                    <a href="{% url 'update_user' user.id %}" class="btn btn-warning btn-sm">
                        Update
                    </a>

                    <a href="{% url 'delete_user' user.id %}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this user?')">
                        Delete
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-danger">No users found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
